<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>登录 - Sofia照片多要素搜索器</title>
  <style>
    html,
    body {
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f6ff;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      color: #1e2d50;
    }
    .card {
      width: min(92vw, 360px);
      max-width: 100%;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(25, 63, 143, 0.12);
      padding: 20px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 18px;
      color: #0d47a1;
    }
    .muted {
      font-size: 13px;
      color: #54627e;
      margin-bottom: 12px;
    }
    .pwd-wrap {
      position: relative;
    }
    input {
      width: 100%;
      border: 1px solid #ccd6ea;
      border-radius: 8px;
      padding: 10px 72px 10px 10px;
      font-size: 16px;
      outline: none;
    }
    .pwd-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      margin: 0;
      border: 0;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #1f4fb5;
      background: #e8f0ff;
      cursor: pointer;
    }
    input:focus {
      border-color: #2c68d8;
      box-shadow: 0 0 0 3px rgba(44, 104, 216, 0.12);
    }
    button {
      width: 100%;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      padding: 10px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #2c68d8;
      cursor: pointer;
    }
    button:disabled {
      background: #9fb6e5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      min-height: 18px;
      font-size: 13px;
      color: #c62828;
    }
    @media (max-width: 420px) {
      body {
        padding: 12px;
      }
      .card {
        width: 100%;
        border-radius: 10px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sofia照片多要素搜索器</h1>
    <div class="muted">请输入访问密码</div>
    <form id="loginForm">
      <div class="pwd-wrap">
        <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        <button id="togglePwd" class="pwd-toggle" type="button">显示</button>
      </div>
      <button id="submitBtn" type="submit">进入系统</button>
    </form>
    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    const pwdEl = document.getElementById("password");
    const togglePwdBtn = document.getElementById("togglePwd");

    function setStatus(text, ok) {
      statusEl.textContent = text || "";
      statusEl.style.color = ok ? "#2e7d32" : "#c62828";
    }

    async function submitLogin(password) {
      const res = await fetch("/api/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ password })
      });
      let data = {};
      try {
        data = await res.json();
      } catch (err) {
        data = {};
      }
      if (!res.ok || !data.ok) {
        if (res.status === 401) {
          throw new Error((data && data.message) || "密码错误，请重新输入");
        }
        if (res.status === 500) {
          throw new Error((data && data.message) || "服务端密码配置异常，请检查db2.ini");
        }
        throw new Error((data && data.message) || "登录失败，请重试");
      }
    }

    togglePwdBtn.addEventListener("click", () => {
      const isPwd = pwdEl.type === "password";
      pwdEl.type = isPwd ? "text" : "password";
      togglePwdBtn.textContent = isPwd ? "隐藏" : "显示";
      pwdEl.focus();
    });

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const password = (pwdEl.value || "").trim();
      if (!password) {
        setStatus("请输入密码", false);
        return;
      }
      submitBtn.disabled = true;
      setStatus("登录中...", true);
      try {
        await submitLogin(password);
        setStatus("登录成功，正在进入...", true);
        window.location.href = "/";
      } catch (err) {
        setStatus(err.message || "登录失败", false);
        pwdEl.focus();
        pwdEl.select();
      } finally {
        submitBtn.disabled = false;
      }
    });

    const isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (!isTouch) {
      pwdEl.focus();
    }
  </script>
</body>
</html>
